# The micromamba env used for every stage of the pipeline, downloads included.
# Only python and pip come from conda-forge; everything else is pip-installed.
#
# Exact reproduction (pins that pip's resolver would otherwise refuse, see pyproject.toml):
#     micromamba create -f environment.yml
#     micromamba activate Udenv
#     pip install --no-deps -r requirements-udenv.txt
#     pip install --no-deps -e .
#     python -m ipykernel install --user --name Udenv
name: Udenv
channels:
  - conda-forge
dependencies:
  - python=3.14.7
  - pip
