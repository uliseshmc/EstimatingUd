[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estimating-ud"
version = "0.1.0"
description = "Estimating Ud, the deleterious mutation rate, from Human/Chimpanzee/Orangutan alignments"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# Runtime dependencies of the package itself (what src/estimating_ud imports).
# scinexus is held at 2026.9.12 although cogent3 2026.10.22 declares >=2026.10.2: the newer
# scinexus breaks `eti alignments` (ensembl_tui 0.7.9, cli.py:633, `alignments[0]` becomes a
# source_proxy). Every cogent3 name imported from scinexus resolves in 2026.9.12 and the
# whole pipeline was checked under this pairing. pip will print a resolver warning: expected.
dependencies = [
    "cogent3==2026.10.22",
    "scinexus==2026.9.12",
    "numpy<2.6",
    "numba==0.68.1rc2",     # the only numba supporting Python 3.14 at the time; cogent3 allows pre-releases
    "pandas>=3",
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "click>=8.1",
]

[project.optional-dependencies]
# The download stage. Not installed by `pip install -e .` because ensembl_tui pins
# cogent3-h5seqs==0.7.3 while Udenv runs 0.9.1 (which reads the existing install/ fine).
# Install with `pip install --no-deps` from requirements-udenv.txt; see docs/pipeline_downloaddata.md.
download = [
    "ensembl_tui==0.7.9",
    "duckdb<2",             # duckdb 2.0 removed Relation.fetchone(), which ensembl_tui 0.7.9 calls
]
dev = ["pytest>=8", "ipykernel", "nbstripout"]

[project.scripts]
ud = "estimating_ud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
